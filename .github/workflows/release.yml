name: Release

# A tag v<major>.<minor>.<patch> is a release of the module: Go's module proxy serves the tagged
# commit to whoever asks for that version, nothing is uploaded anywhere. So this workflow runs the
# CI again on the tagged commit, and checks that the tag is a valid version, has its entry in
# CHANGELOG.md, and is on main; then, once a maintainer approved it in the protected environment
# "release", it asks the module proxy for the version, which fetches it (pkg.go.dev lists it from
# there). Protect v* tags with a ruleset (README, "Releasing"): a tag, once fetched by the proxy,
# is the version for good.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  tag:
    name: The tag is a version of main
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # RUNNER_TEMP is the job's own directory, emptied at its start and end: temporary files, and
      # the tools and caches the job installs, go there. Set here: the job's `env` cannot read the
      # runner context.
      - name: Use the runner's own temporary directory
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: A valid version, in CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Semantic versioning 2.0.0, without a pre-release or build part: vMAJOR.MINOR.PATCH.
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::$TAG is not a version vMAJOR.MINOR.PATCH."
            exit 1
          fi
          # Its entry: "## MAJOR.MINOR.PATCH - YYYY-MM-DD" (its release date), or without the date.
          version="${TAG#v}"
          if ! grep --quiet --extended-regexp "^## ${version//./\\.}( - [0-9]{4}-[0-9]{2}-[0-9]{2})?\$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry ## $version - YYYY-MM-DD."
            exit 1
          fi
      # fetch-depth 0: the whole history, origin/main included.
      - name: On main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$GITHUB_REF_NAME points to a commit that is not on main."
            exit 1
          fi

  publish:
    name: The version on Go's module proxy
    needs: [ci, tag]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The protected environment (required reviewers: a maintainer approves each release). No
    # credential: the proxy fetches the tagged commit of this public repository when asked for the
    # version, and records its checksum in the checksum database for good.
    environment: release
    env:
      GOTOOLCHAIN: local
    steps:
      # RUNNER_TEMP is the job's own directory, emptied at its start and end: temporary files, and
      # the tools and caches the job installs, go there. Set here: the job's `env` cannot read the
      # runner context.
      - name: Use the runner's own temporary directory
        run: |
          {
            echo "TMPDIR=$RUNNER_TEMP"
            echo "GOPATH=$RUNNER_TEMP/go"
            echo "GOMODCACHE=$RUNNER_TEMP/go/pkg/mod"
            echo "GOCACHE=$RUNNER_TEMP/go-build"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: false
      # Outside any module: the version as the proxy serves it to everybody (go.dev's way to have
      # a version listed: "GOPROXY=proxy.golang.org go list -m <module>@<version>").
      - name: Ask the module proxy for the version
        env:
          TAG: ${{ github.ref_name }}
          GOPROXY: https://proxy.golang.org
        run: |
          cd "$RUNNER_TEMP"
          go list -m -json "github.com/sattleme/checkout-go@$TAG"
